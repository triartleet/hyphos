<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>hyphos</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#0f766e" />
    <style>
      :root {
        --bg: #f7f6f3;
        --card: #ffffff;
        --ink: #1c1917;
        --muted: #78716c;
        --line: #e7e5e4;
        --accent: #0f766e;
        --accent-ink: #ffffff;
        --accent-soft: #ccfbf1;
        --good: #15803d;
        --mid: #b45309;
        --bad: #b91c1c;
        --shadow: 0 1px 3px rgba(0, 0, 0, 0.06), 0 8px 24px rgba(0, 0, 0, 0.05);
        --radius: 16px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #12100e;
          --card: #1c1917;
          --ink: #f5f5f4;
          --muted: #a8a29e;
          --line: #292524;
          --accent: #2dd4bf;
          --accent-ink: #042f2e;
          --accent-soft: #134e4a;
          --shadow: 0 1px 3px rgba(0, 0, 0, 0.4), 0 8px 24px rgba(0, 0, 0, 0.3);
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font:
          15px/1.55 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Inter,
          Roboto,
          sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 14px 22px;
        flex-wrap: wrap;
      }
      .brand {
        display: flex;
        align-items: baseline;
        gap: 8px;
        margin-right: 8px;
      }
      .brand b {
        font-size: 20px;
        letter-spacing: 0.2px;
      }
      .brand span {
        color: var(--muted);
        font-size: 13px;
      }
      .tabs {
        display: flex;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 4px;
        box-shadow: var(--shadow);
      }
      .tabs button {
        border: 0;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
        padding: 7px 16px;
        border-radius: 999px;
        font: inherit;
        font-size: 13.5px;
        transition: all 0.18s ease;
      }
      .tabs button.on {
        background: var(--accent);
        color: var(--accent-ink);
        font-weight: 600;
      }
      main {
        flex: 1;
        display: grid;
        grid-template-columns: 1fr 56px 1fr;
        gap: 0;
        padding: 8px 22px 18px;
        max-width: 1240px;
        width: 100%;
        margin: 0 auto;
        align-items: stretch;
      }
      .pane {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        display: flex;
        flex-direction: column;
        min-height: 420px;
        overflow: hidden;
        transition: border-color 0.2s;
      }
      .pane:focus-within {
        border-color: var(--accent);
      }
      .pane .bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 16px;
        border-bottom: 1px solid var(--line);
        color: var(--muted);
        font-size: 12.5px;
        letter-spacing: 0.4px;
        text-transform: uppercase;
      }
      textarea {
        flex: 1;
        border: 0;
        outline: 0;
        resize: none;
        padding: 18px;
        background: transparent;
        color: var(--ink);
        font: inherit;
        font-size: 16px;
      }
      #out {
        flex: 1;
        padding: 18px;
        font-size: 16px;
        white-space: pre-wrap;
        overflow: auto;
      }
      #out.empty {
        color: var(--muted);
      }
      #out.loading {
        background: linear-gradient(
          100deg,
          transparent 30%,
          rgba(127, 127, 127, 0.09) 50%,
          transparent 70%
        );
        background-size: 300% 100%;
        animation: shimmer 1.2s infinite;
      }
      @keyframes shimmer {
        0% {
          background-position: 100% 0;
        }
        100% {
          background-position: -100% 0;
        }
      }
      .mid {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }
      .go {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 0;
        cursor: pointer;
        background: var(--accent);
        color: var(--accent-ink);
        font-size: 18px;
        box-shadow: var(--shadow);
        transition: transform 0.15s ease;
      }
      .go:hover {
        transform: scale(1.08);
      }
      .go:disabled {
        opacity: 0.45;
        cursor: default;
        transform: none;
      }
      .paneft {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 10px 16px;
        border-top: 1px solid var(--line);
        min-height: 52px;
        flex-wrap: wrap;
      }
      .chip {
        display: none;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        background: var(--accent-soft);
        color: var(--ink);
        border-radius: 999px;
        padding: 5px 12px;
      }
      .chip .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
      }
      .small {
        color: var(--muted);
        font-size: 12.5px;
      }
      .btn {
        border: 1px solid var(--line);
        background: transparent;
        color: var(--ink);
        border-radius: 10px;
        padding: 6px 13px;
        cursor: pointer;
        font: inherit;
        font-size: 13px;
        transition: background 0.15s;
      }
      .btn:hover {
        background: var(--accent-soft);
      }
      details.tune {
        margin: 0 22px 20px;
        max-width: 1240px;
        width: calc(100% - 44px);
        align-self: center;
      }
      details.tune summary {
        cursor: pointer;
        color: var(--muted);
        font-size: 13px;
        width: max-content;
        padding: 4px 8px;
        border-radius: 8px;
        user-select: none;
      }
      details.tune summary:hover {
        color: var(--ink);
      }
      .tunerow {
        display: flex;
        gap: 26px;
        flex-wrap: wrap;
        padding: 14px 16px;
        margin-top: 8px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        font-size: 13.5px;
      }
      .tunerow label {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      select {
        font: inherit;
        font-size: 13.5px;
        background: var(--bg);
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 4px 8px;
      }
      footer {
        padding: 0 22px 16px;
        text-align: center;
        color: var(--muted);
        font-size: 12px;
      }
      kbd {
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 0 5px;
        font-size: 11px;
      }
      @media (max-width: 820px) {
        main {
          grid-template-columns: 1fr;
          gap: 12px;
        }
        .mid {
          flex-direction: row;
        }
        .go {
          transform: rotate(90deg);
        }
        .pane {
          min-height: 240px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand"><b>hyphos</b><span>ύφος · your voice, kept</span></div>
      <nav class="tabs" id="tabs"></nav>
    </header>

    <main>
      <section class="pane">
        <div class="bar">
          <span>AI draft</span><span class="small" id="count"></span>
        </div>
        <textarea
          id="in"
          placeholder="Paste any AI-generated draft…"
          autofocus
        ></textarea>
        <div class="paneft">
          <span class="small"
            >The engine rewrites meaning-for-meaning, in your register.</span
          >
        </div>
      </section>

      <div class="mid">
        <button class="go" id="go" title="Rewrite (⌘⏎)">→</button>
      </div>

      <section class="pane">
        <div class="bar">
          <span>You</span><span class="small" id="backend"></span>
        </div>
        <div id="out" class="empty">The rewrite lands here.</div>
        <div class="paneft">
          <span class="chip" id="chip"
            ><span class="dot"></span><span id="chiptext"></span
          ></span>
          <span class="small" id="changes"></span>
          <span style="flex: 1"></span>
          <span id="fb" style="display: none; gap: 6px; align-items: center">
            <button class="btn" data-v="good" title="mark this output good">
              👍
            </button>
            <button class="btn" data-v="fine" title="mark this output fine">
              〰️
            </button>
            <button
              class="btn"
              data-v="bad"
              title="mark this output bad (asks why)"
            >
              👎
            </button>
          </span>
          <span class="small" id="fbhint"></span>
          <button class="btn" id="copy" hidden>Copy</button>
        </div>
      </section>
    </main>

    <details class="tune">
      <summary>Tune</summary>
      <div class="tunerow">
        <label
          >Backend
          <select id="tbackend">
            <option value="auto">auto (subscription first)</option>
            <option value="claude">claude CLI</option>
            <option value="api">API key</option>
          </select>
        </label>
        <label
          title="Measured, characteristic imperfections from your own typo catalog (D-006)"
          >Typos
          <select id="ttypos">
            <option value="none">none (default)</option>
            <option value="natural">natural (measured)</option>
          </select>
        </label>
        <label
          ><input type="checkbox" id="tshow" checked /> Show what enforcement
          changed</label
        >
        <label
          title="A second, model-judged fidelity opinion — slower, uses the backend"
          ><input type="checkbox" id="tjudge" /> Judge pass</label
        >
      </div>
    </details>

    <footer>
      Local only — your text never leaves this machine · <kbd>⌘</kbd
      ><kbd>⏎</kbd> rewrites
    </footer>

    <script>
      const $ = (id) => document.getElementById(id);
      let reg = localStorage.getItem("hyphos.reg") || "auto";
      const tabs = $("tabs");

      function addTab(value, label, hint) {
        const b = document.createElement("button");
        b.textContent = label;
        if (hint) {
          b.title = hint;
          b.textContent += " ·";
        }
        b.dataset.v = value;
        b.onclick = () => {
          reg = value;
          localStorage.setItem("hyphos.reg", value);
          paint();
        };
        tabs.appendChild(b);
      }
      function paint() {
        for (const b of tabs.children)
          b.classList.toggle("on", b.dataset.v === reg);
      }
      // Registers are discovered, never declared (D-007): the server lists what
      // the profiles can produce, with sampling-depth confidence.
      addTab("auto", "auto", "infer the register from the draft");
      fetch("/api/registers")
        .then((r) => r.json())
        .then((d) => {
          for (const r of d.registers || []) {
            const label = r.register
              .replace("technical-instruction", "technical")
              .replace("email-semi-formal", "email");
            addTab(r.register, label, r.hint);
          }
          if (![...tabs.children].some((b) => b.dataset.v === reg))
            reg = "auto";
          paint();
        })
        .catch(() => {
          addTab("editorial", "editorial");
          paint();
        });

      $("in").value = localStorage.getItem("hyphos.draft") || "";
      $("in").addEventListener("input", () => {
        localStorage.setItem("hyphos.draft", $("in").value);
        const w = $("in").value.trim().split(/\s+/).filter(Boolean).length;
        $("count").textContent = w ? w + " words" : "";
      });
      $("in").dispatchEvent(new Event("input"));

      async function run() {
        const text = $("in").value.trim();
        if (!text) return;
        const out = $("out");
        $("go").disabled = true;
        out.classList.remove("empty");
        out.classList.add("loading");
        out.textContent = "Rewriting in your voice…";
        $("chip").style.display = "none";
        $("changes").textContent = "";
        $("copy").hidden = true;
        try {
          const r = await fetch("/api/rewrite", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              text,
              register: reg,
              backend: $("tbackend").value,
              typos: $("ttypos").value,
              judge: $("tjudge").checked,
            }),
          });
          const d = await r.json();
          if (!r.ok) throw new Error(d.error || r.statusText);
          out.textContent = d.text;
          lastRegister = d.register || reg;
          $("backend").textContent =
            "via " +
            d.backend +
            (d.inferred
              ? ` · auto → ${d.inferred.register}` +
                (d.inferred.confidence === "low" ? " (low conf.)" : "")
              : "");
          $("copy").hidden = false;
          $("fb").style.display = "inline-flex";
          $("fbhint").textContent = "";
          const s = d.score || {};
          if (s.fidelity !== undefined) {
            const chip = $("chip");
            chip.style.display = "inline-flex";
            const good = s.fidelity >= 60,
              mid = s.fidelity >= 35;
            chip.querySelector(".dot").style.background = good
              ? "var(--good)"
              : mid
                ? "var(--mid)"
                : "var(--bad)";
            $("chiptext").textContent =
              `fidelity ${s.fidelity}` +
              (s.confidence === "low" ? " (low conf.)" : "") +
              ` · ${s.model_ism_signals} ism${s.model_ism_signals === 1 ? "" : "s"}` +
              (s.judge && s.judge.overall !== undefined
                ? ` · judge ${s.judge.overall}`
                : "");
          }
          if ($("tshow").checked && d.enforcement) {
            const e = d.enforcement;
            const bits = [];
            const applied = Object.entries(e.applied || {});
            if (applied.length)
              bits.push(
                "fixed: " + applied.map(([k, v]) => `${k}×${v}`).join(", "),
              );
            const flags = Object.entries(e.flags || {});
            if (flags.length)
              bits.push(
                "flagged: " + flags.map(([k, v]) => `${k}×${v}`).join(", "),
              );
            $("changes").textContent = bits.length
              ? "rules: " + bits.join(" · ")
              : "rules: clean pass";
          }
        } catch (err) {
          out.textContent = "Backend problem: " + err.message;
        } finally {
          out.classList.remove("loading");
          $("go").disabled = false;
        }
      }
      $("go").onclick = run;
      document.addEventListener("keydown", (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key === "Enter") run();
      });
      $("copy").onclick = async () => {
        await navigator.clipboard.writeText($("out").textContent);
        $("copy").textContent = "Copied";
        setTimeout(() => ($("copy").textContent = "Copy"), 1200);
      };
      let lastRegister = null;
      for (const b of $("fb").querySelectorAll("button")) {
        b.onclick = async () => {
          const verdict = b.dataset.v;
          const note =
            verdict === "bad"
              ? prompt("What was off? One line helps the engine improve.") || ""
              : "";
          const r = await fetch("/api/feedback", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              register: lastRegister || reg,
              verdict,
              note,
            }),
          })
            .then((x) => x.json())
            .catch(() => ({}));
          $("fb").style.display = "none";
          $("fbhint").textContent = r.suggestion || "noted";
        };
      }
      if ("serviceWorker" in navigator)
        navigator.serviceWorker.register("sw.js");
    </script>
  </body>
</html>
